<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>oshiTag</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <a
        class="icon-link"
        href="https://github.com/uuzp/oshitag"
        target="_blank"
        rel="noreferrer"
        aria-label="GitHub"
        title="GitHub"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.53.1.72-.23.72-.51v-1.8c-2.93.64-3.55-1.25-3.55-1.25-.48-1.21-1.17-1.53-1.17-1.53-.96-.66.07-.65.07-.65 1.06.08 1.62 1.09 1.62 1.09.94 1.61 2.46 1.15 3.06.88.1-.68.37-1.15.67-1.41-2.34-.27-4.81-1.17-4.81-5.22 0-1.15.41-2.09 1.08-2.83-.11-.27-.47-1.37.1-2.85 0 0 .88-.28 2.88 1.08a9.95 9.95 0 0 1 5.25 0c2-1.36 2.88-1.08 2.88-1.08.57 1.48.21 2.58.1 2.85.67.74 1.08 1.68 1.08 2.83 0 4.06-2.47 4.95-4.82 5.21.38.33.72.97.72 1.96v2.9c0 .28.19.61.73.51A10.5 10.5 0 0 0 12 1.5Z" fill="currentColor"/>
        </svg>
      </a>
      <div class="app-title">
        <h1>oshiTag</h1>
      </div>
    </div>
    <div class="header-actions">
      <button id="btnEdit" class="btn btn-secondary btn-edit" type="button" aria-label="编辑" aria-pressed="false">＋</button>
      <div class="menu">
        <button id="btnMenu" class="btn btn-secondary" aria-haspopup="true" aria-expanded="false">⋯</button>
        <div id="menuPanel" class="menu-panel" role="menu" aria-hidden="true">
          <button id="btnExportMd" class="menu-item" role="menuitem" data-i18n="menu.export">导出</button>
          <label class="menu-item" role="menuitem" for="fileImportMd" data-i18n="menu.import">导入</label>
          <input id="fileImportMd" class="sr-only" type="file" />
          <button id="btnRestoreBackup" class="menu-item" role="menuitem" data-i18n="menu.restoreBackup">恢复备份</button>
          <button id="btnHelp" class="menu-item" role="menuitem" data-i18n="menu.help">帮助</button>
          <button id="btnLang" class="menu-item" role="menuitem" data-i18n="menu.language">语言</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div id="groupTabs" class="tabs" aria-label="组合"></div>
      <div id="groupStage" class="stage" aria-label="当前组合"></div>
    </section>

    <section class="panel" id="favoritesPanel">
      <div id="favTabs" class="tabs" aria-label="收藏夹"></div>
      <div id="favStage" class="stage" aria-label="当前收藏夹"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle" class="modal-title">Modal</h3>
        <button class="icon-btn ghost" type="button" data-modal-close aria-label="关闭">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
